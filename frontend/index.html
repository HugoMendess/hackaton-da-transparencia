<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f7b40" />
    <meta
      name="description"
      content="O futuro Portal da Transparência do Maranhão. Construído para o cidadão, do celular para o desktop, sem jargão e em até 3 passos."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <title>TransparaMA, o futuro Portal da Transparência do Maranhão</title>
    <script>
      // Aplica preferências de acessibilidade ANTES do React montar.
      // Evita flash sem estilo e garante persistência entre navegações.
      (function () {
        try {
          var raw = localStorage.getItem('transparama:a11y');
          if (!raw) return;
          var c = JSON.parse(raw);
          var html = document.documentElement;
          if (c.altoContraste) html.classList.add('high-contrast');
          if (c.fonte === 1) html.classList.add('font-size-larger');
          if (c.fonte === 2) html.classList.add('font-size-larger-2');
          if (c.reduzirMovimento) html.classList.add('reduce-motion');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
